CONTRACT_TYPE
{
	sortKey = a5

	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		
		contractType = SunTourism
		minCount = 1
		
	}
	DATA
	{
		type = string
		craft = MohoTourismPlane
	}
	name = MohoTourism
	title = Hot Tourist Destinations
	group = TaTourism
	description = It's always winter somewhere on Kerbin, so tourists naturally want to escape the cold. This is why we've begun offering trips to Moho - the hottest destination in the Solar System. Of course, you will have to take more Kerbals than usual on this trip, but they will pay more.
	notes = For this mission, you'll need to get an Eve gravity assist.
	synopsis = Board the tourists in your space plane, get a gravity assist from Eve, land on Moho, then land back at the KSC.
	completedMessage = You did it! Did you visit the Mohole? I heard it's pretty this time of the year
	agent = Tudor Airlines
	minExpiry = 0.0
    maxExpiry = 0.0
	cancellable = true
	declinable = false
	autoAccept = false
	prestige = Trivial
   	targetBody = Kerbin
	maxSimultaneous = 1
	rewardScience = Random(70, 100)
    rewardReputation = 50.0
    rewardFunds = Random(850000, 980000)
    failureReputation = 70.0
    failureFunds = 1200000.0
    advanceFunds = 105000.0
	BEHAVIOUR
	{
		name = SpawnPassengers
		type = SpawnPassengers
		count = Random(10, 15)
		kerbalType = Tourist
		removePassengers = true
	}
	PARAMETER
		{
			name = VesselParameterGroup
			type = VesselParameterGroup
			title = Your aircraft must
			
			define = @/craft
			dissassociateVesselsOnContractCompletion = true

			PARAMETER
			{
				name = HasCrew
				type = HasCrew
				title = have a certified pilot
				
				trait = Pilot
				minCrew = 1
			
				disableOnStateChange = false
				hideChildren = true

			}
			PARAMETER
			{
				name = HasPassengers
				type = HasPassengers

			}

			PARAMETER
			{
				name = PartValidation
				type = PartValidation
				title = have wings
				
				category = Aero
				
				disableOnStateChange = false
				hideChildren = true

			}
			
			PARAMETER
			{
				name = PartValidation
				type = PartValidation
				title = not have any solid rocket motors

				NONE
				{
					MODULE
					{
						name = ModuleEngines
						allowShutdown = False
						
					}
					
				}
				
				disableOnStateChange = false
				hideChildren = true
				
			}
			
			disableOnStateChange = false

		}
		//Things to acomplish
	PARAMETER
	{
		name = All
		type = All
		title = Get a gravity assist from Eve
		
		PARAMETER
		{
			name = VesselParameterGroup
			type = VesselParameterGroup
			title = Flyby Eve!
			
			vessel = @/craft
			
			PARAMETER
			{
				name = ReachState
				type = ReachState
				
				targetBody = Eve
				situation = ESCAPING
				
				disableOnStateChange = false
				hideChildren = true
				hidden = true
				
			}
		
			completeInSequence = false
			disableOnStateChange = false
			hideChildren = true	

		}	
	}
	PARAMETER
	{
		name = All
		type = All
		title = Visit Moho
		
		PARAMETER
		{
			name = VesselParameterGroup
			type = VesselParameterGroup
			title = Land on Moho!
			
			vessel = @/craft
			
			PARAMETER
			{
				name = ReachState
				type = ReachState
				
				targetBody = Moho
				situation = LANDED
                maxSpeed = 0.0
				
				disableOnStateChange = false
				hideChildren = true
				hidden = true
				
			}
		
			completeInSequence = false
			disableOnStateChange = false
			hideChildren = true	

		}	
	}

	PARAMETER
	{
		name = Any
		type = Any
		title = And then land and stop
		
		PARAMETER
		{
			name = Any
			type = Any
			title = at one of the following recovery areas:

			PARAMETER
			{
				name = VesselParameterGroup
				type = VesselParameterGroup
				title = the KSC Runway
				
				vessel = @/craft

			PARAMETER
				{
					name = ReachState
					type = ReachState
					
					targetBody = Kerbin
					biome = Runway
					situation = LANDED
					maxSpeed = 0.0

					disableOnStateChange = false
					hideChildren = true

				}

				disableOnStateChange = false
				hideChildren = true		

			}
			
			PARAMETER
			{
				name = VesselParameterGroup
				type = VesselParameterGroup
				title = or the Spaceplane Hangar Air Terminal
				
				vessel = @/craft

			PARAMETER
				{
					name = ReachState
					type = ReachState
					
					targetBody = Kerbin
					biome = SPH
					situation = LANDED
					maxSpeed = 0.0

					disableOnStateChange = false
					hideChildren = true

				}
				
				disableOnStateChange = false
				hideChildren = true		

			}
		
			disableOnStateChange = false
		
		}
		
		completeInSequence = true
		disableOnStateChange = false

	}

//Recovery Parameter - Craft & Kerbal Safety Check
	PARAMETER
	{
		name = All
		type = All
		title = Safely
		
		PARAMETER
		{
			name = VesselNotDestroyed
			type = VesselNotDestroyed
			title = without destroying your aircraft
			
			vessel = @/craft

		}
		
		PARAMETER
		{
			name = KerbalDeaths
			type = KerbalDeaths
			title = or killing anyone
			
			vessel = @/craft

		}

		completeInSequence = true
		disableOnStateChange = true

	}
}
