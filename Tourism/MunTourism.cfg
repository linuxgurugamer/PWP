CONTRACT_TYPE
{
	sortKey = a5

	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		
		contractType = OrbitalTourism
		minCount = 1
		
	}
	DATA
	{
		type = string
		craft = MunTourismPlane
	}
	name = MunTourism
	title = Mun Tourism
	group = TaTourism
	description = That's one small step for a Kerbal, one giant leap for Kerbalkind! That's what Neil Kerman said when we were faking the Mun landing. The tourists will not be so easy to fool, so make sure to actually get them to the Mun.
	notes = No, you can not claim that you own the Mun because of the Outer Space Treaty
	synopsis = Board the tourists in your space plane, get them to the Mun, then land back at the KSC.
	completedMessage = You did it! Now, we should fake a Duna landing.
	agent = Tudor Airlines
	minExpiry = 0.0
    maxExpiry = 0.0
	cancellable = true
	declinable = false
	autoAccept = false
	prestige = Trivial
   	targetBody = Kerbin
	maxSimultaneous = 1
	rewardScience = 20.0
    rewardReputation = 25.0
    rewardFunds = Random(110000, 220000)
    failureReputation = 35.0
    failureFunds = 300000.0
    advanceFunds = 35000.0
	BEHAVIOUR
	{
		name = SpawnPassengers
		type = SpawnPassengers
		count = Random(3, 9)
		kerbalType = Tourist
		removePassengers = true
	}
	PARAMETER
		{
			name = VesselParameterGroup
			type = VesselParameterGroup
			title = Your aircraft must
			
			define = @/craft
			dissassociateVesselsOnContractCompletion = true

			PARAMETER
			{
				name = HasCrew
				type = HasCrew
				title = have a certified pilot
				
				trait = Pilot
				minCrew = 1
			
				disableOnStateChange = false
				hideChildren = true

			}
			PARAMETER
			{
				name = HasPassengers
				type = HasPassengers

			}

			PARAMETER
			{
				name = PartValidation
				type = PartValidation
				title = have wings
				
				category = Aero
				
				disableOnStateChange = false
				hideChildren = true

			}
			
			PARAMETER
			{
				name = PartValidation
				type = PartValidation
				title = not have any solid rocket motors

				NONE
				{
					MODULE
					{
						name = ModuleEngines
						allowShutdown = False
						
					}
					
				}
				
				disableOnStateChange = false
				hideChildren = true
				
			}
			
			disableOnStateChange = false

		}
		//Things to acomplish
	PARAMETER
	{
		name = All
		type = All
		title = Get to space
		
		PARAMETER
		{
			name = VesselParameterGroup
			type = VesselParameterGroup
			title = Land on the Mun!
			
			vessel = @/craft
			
			PARAMETER
			{
				name = ReachState
				type = ReachState
				
				targetBody = Mun
				situation = LANDED
                maxSpeed = 0.0
				
				disableOnStateChange = false
				hideChildren = true
				hidden = true
				
			}
		
			completeInSequence = false
			disableOnStateChange = false
			hideChildren = true	

		}	
	}

	PARAMETER
	{
		name = Any
		type = Any
		title = And then land and stop
		
		PARAMETER
		{
			name = Any
			type = Any
			title = at one of the following recovery areas:

			PARAMETER
			{
				name = VesselParameterGroup
				type = VesselParameterGroup
				title = the KSC Runway
				
				vessel = @/craft

			PARAMETER
				{
					name = ReachState
					type = ReachState
					
					targetBody = Kerbin
					biome = Runway
					situation = LANDED
					maxSpeed = 0.0

					disableOnStateChange = false
					hideChildren = true

				}

				disableOnStateChange = false
				hideChildren = true		

			}
			
			PARAMETER
			{
				name = VesselParameterGroup
				type = VesselParameterGroup
				title = or the Spaceplane Hangar Air Terminal
				
				vessel = @/craft

			PARAMETER
				{
					name = ReachState
					type = ReachState
					
					targetBody = Kerbin
					biome = SPH
					situation = LANDED
					maxSpeed = 0.0

					disableOnStateChange = false
					hideChildren = true

				}
				
				disableOnStateChange = false
				hideChildren = true		

			}
		
			disableOnStateChange = false
		
		}
		
		completeInSequence = true
		disableOnStateChange = false

	}

//Recovery Parameter - Craft & Kerbal Safety Check
	PARAMETER
	{
		name = All
		type = All
		title = Safely
		
		PARAMETER
		{
			name = VesselNotDestroyed
			type = VesselNotDestroyed
			title = without destroying your aircraft
			
			vessel = @/craft

		}
		
		PARAMETER
		{
			name = KerbalDeaths
			type = KerbalDeaths
			title = or killing anyone
			
			vessel = @/craft

		}

		completeInSequence = true
		disableOnStateChange = true

	}
}
