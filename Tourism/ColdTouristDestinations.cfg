CONTRACT_TYPE
{
	sortKey = a5

	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		
		contractType = MohoTourism
		minCount = 1
		
	}
	DATA
	{
		type = string
		craft = EelooTourismPlane
	}
	name = EelooTourism
	title = Cold Tourist Destinations
	group = TaTourism
	description = The winter season is over, and Kerbals are now anxious to escape the summer heat. We should organize multi-year cruises to the far-off Eeloo, the perfect chilly destination. However, Eeloo is so small that you might miss it. Perhaps we shouldn't even call it a planet, then. In an case, don't forget your binoculars.
	notes = You will need to bring a lot of tourists on this trip. As for how you get there, we'll leave that to you.
	synopsis = Board the tourists in your space plane, land on Eeloo, then land back at the KSC.
	completedMessage = You did it! We weren't entirely sure if that large of a space plane could re-enter the atmosphere safely, but you did it!
	agent = Tudor Airlines
	minExpiry = 0.0
    maxExpiry = 0.0
	cancellable = true
	declinable = false
	autoAccept = false
	prestige = Trivial
   	targetBody = Kerbin
	maxSimultaneous = 1
	rewardScience = Random(100, 120)
    rewardReputation = 50.0
    rewardFunds = Random(950000, 1300000)
    failureReputation = 70.0
    failureFunds = 1200000.0
    advanceFunds = 105000.0
	BEHAVIOUR
	{
		name = SpawnPassengers
		type = SpawnPassengers
		count = Random(24, 33)
		kerbalType = Tourist
		removePassengers = true
	}
	PARAMETER
		{
			name = VesselParameterGroup
			type = VesselParameterGroup
			title = Your aircraft must
			
			define = @/craft
			dissassociateVesselsOnContractCompletion = true

			PARAMETER
			{
				name = HasCrew
				type = HasCrew
				title = have a certified pilot
				
				trait = Pilot
				minCrew = 1
			
				disableOnStateChange = false
				hideChildren = true

			}
			PARAMETER
			{
				name = HasPassengers
				type = HasPassengers

			}

			PARAMETER
			{
				name = PartValidation
				type = PartValidation
				title = have wings
				
				category = Aero
				
				disableOnStateChange = false
				hideChildren = true

			}
			
			PARAMETER
			{
				name = PartValidation
				type = PartValidation
				title = not have any solid rocket motors

				NONE
				{
					MODULE
					{
						name = ModuleEngines
						allowShutdown = False
						
					}
					
				}
				
				disableOnStateChange = false
				hideChildren = true
				
			}
			
			disableOnStateChange = false

		}
		//Things to acomplish
	PARAMETER
	{
		name = All
		type = All
		title = Visit Eeloo
		
		PARAMETER
		{
			name = VesselParameterGroup
			type = VesselParameterGroup
			title = Land on Eeloo!
			
			vessel = @/craft
			
			PARAMETER
			{
				name = ReachState
				type = ReachState
				
				targetBody = Eeloo
				situation = LANDED
                maxSpeed = 0.0
				
				disableOnStateChange = false
				hideChildren = true
				hidden = true
				
			}
		
			completeInSequence = false
			disableOnStateChange = false
			hideChildren = true	

		}	
	}

	PARAMETER
	{
		name = Any
		type = Any
		title = And then land and stop
		
		PARAMETER
		{
			name = Any
			type = Any
			title = at one of the following recovery areas:

			PARAMETER
			{
				name = VesselParameterGroup
				type = VesselParameterGroup
				title = the KSC Runway
				
				vessel = @/craft

			PARAMETER
				{
					name = ReachState
					type = ReachState
					
					targetBody = Kerbin
					biome = Runway
					situation = LANDED
					maxSpeed = 0.0

					disableOnStateChange = false
					hideChildren = true

				}

				disableOnStateChange = false
				hideChildren = true		

			}
			
			PARAMETER
			{
				name = VesselParameterGroup
				type = VesselParameterGroup
				title = or the Spaceplane Hangar Air Terminal
				
				vessel = @/craft

			PARAMETER
				{
					name = ReachState
					type = ReachState
					
					targetBody = Kerbin
					biome = SPH
					situation = LANDED
					maxSpeed = 0.0

					disableOnStateChange = false
					hideChildren = true

				}
				
				disableOnStateChange = false
				hideChildren = true		

			}
		
			disableOnStateChange = false
		
		}
		
		completeInSequence = true
		disableOnStateChange = false

	}

//Recovery Parameter - Craft & Kerbal Safety Check
	PARAMETER
	{
		name = All
		type = All
		title = Safely
		
		PARAMETER
		{
			name = VesselNotDestroyed
			type = VesselNotDestroyed
			title = without destroying your aircraft
			
			vessel = @/craft

		}
		
		PARAMETER
		{
			name = KerbalDeaths
			type = KerbalDeaths
			title = or killing anyone
			
			vessel = @/craft

		}

		completeInSequence = true
		disableOnStateChange = true

	}
}
