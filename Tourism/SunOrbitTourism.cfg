CONTRACT_TYPE
{
	sortKey = a5

	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		
		contractType = MunTourism
		minCount = 1
		
	}
	DATA
	{
		type = string
		craft = SunTourismPlane
	}
	name = SunTourism
	title = Sun Tourism
	group = TaTourism
	description = Recently, leaving Kerbin's sphere of infuluence has been all the craze. We should start organizing tours to just outside Kerbin's SOI
	notes = Try not to go too far, you might not be able to come back
	synopsis = Board the tourists in your space plane, enter Sun orbit, then land back at the KSC.
	completedMessage = You did it! Now, we sould look into organizing tours to other places in the Solar System.
	agent = Tudor Airlines
	minExpiry = 0.0
    maxExpiry = 0.0
	cancellable = true
	declinable = false
	autoAccept = false
	prestige = Trivial
   	targetBody = Kerbin
	maxSimultaneous = 1
	rewardScience = 7.0
    rewardReputation = 15.0
    rewardFunds = Random(100000, 170000)
    failureReputation = 15.0
    failureFunds = 200000.0
    advanceFunds = 15000.0
	BEHAVIOUR
	{
		name = SpawnPassengers
		type = SpawnPassengers
		count = Random(4, 7)
		kerbalType = Tourist
		removePassengers = true
	}
	PARAMETER
		{
			name = VesselParameterGroup
			type = VesselParameterGroup
			title = Your aircraft must
			
			define = @/craft
			dissassociateVesselsOnContractCompletion = true

			PARAMETER
			{
				name = HasCrew
				type = HasCrew
				title = have a certified pilot
				
				trait = Pilot
				minCrew = 1
			
				disableOnStateChange = false
				hideChildren = true

			}
			PARAMETER
			{
				name = HasPassengers
				type = HasPassengers

			}

			PARAMETER
			{
				name = PartValidation
				type = PartValidation
				title = have wings
				
				category = Aero
				
				disableOnStateChange = false
				hideChildren = true

			}
			
			PARAMETER
			{
				name = PartValidation
				type = PartValidation
				title = not have any solid rocket motors

				NONE
				{
					MODULE
					{
						name = ModuleEngines
						allowShutdown = False
						
					}
					
				}
				
				disableOnStateChange = false
				hideChildren = true
				
			}
			
			disableOnStateChange = false

		}
		//Things to acomplish
	PARAMETER
		{
			name = VesselParameterGroup
			type = VesselParameterGroup
			title = Get to sun orbit
			
			vessel = @/craft
			
			PARAMETER
			{
				name = ReachState
				type = ReachState
				title = Reach stable sun orbit
				
				targetBody = Sun
				situation = ORBITING

				disableOnStateChange = true
				hideChildren = true
				hidden = true
				
			}
		
			completeInSequence = false
			disableOnStateChange = false
			hideChildren = true	

		}

	PARAMETER
	{
		name = Any
		type = Any
		title = And then land and stop
		
		PARAMETER
		{
			name = Any
			type = Any
			title = at one of the following recovery areas:

			PARAMETER
			{
				name = VesselParameterGroup
				type = VesselParameterGroup
				title = the KSC Runway
				
				vessel = @/craft

			PARAMETER
				{
					name = ReachState
					type = ReachState
					
					targetBody = Kerbin
					biome = Runway
					situation = LANDED
					maxSpeed = 0.0

					disableOnStateChange = false
					hideChildren = true

				}

				disableOnStateChange = false
				hideChildren = true		

			}
			
			PARAMETER
			{
				name = VesselParameterGroup
				type = VesselParameterGroup
				title = or the Spaceplane Hangar Air Terminal
				
				vessel = @/craft

			PARAMETER
				{
					name = ReachState
					type = ReachState
					
					targetBody = Kerbin
					biome = SPH
					situation = LANDED
					maxSpeed = 0.0

					disableOnStateChange = false
					hideChildren = true

				}
				
				disableOnStateChange = false
				hideChildren = true		

			}
		
			disableOnStateChange = false
		
		}
		
		completeInSequence = true
		disableOnStateChange = false

	}

//Recovery Parameter - Craft & Kerbal Safety Check
	PARAMETER
	{
		name = All
		type = All
		title = Safely
		
		PARAMETER
		{
			name = VesselNotDestroyed
			type = VesselNotDestroyed
			title = without destroying your aircraft
			
			vessel = @/craft

		}
		
		PARAMETER
		{
			name = KerbalDeaths
			type = KerbalDeaths
			title = or killing anyone
			
			vessel = @/craft

		}

		completeInSequence = true
		disableOnStateChange = true

	}
}
