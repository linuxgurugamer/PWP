CONTRACT_TYPE
{
	sortKey = a5

	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		
		contractType = SunTourism
		minCount = 1
		
	}
	DATA
	{
		type = string
		craft = SubOrbitalTourismPlane
	}
	name = JoolTourism
	title = Jool Moons Voyage
	group = TaTourism
	description = Jool's 5 moons, from the barren Tylo to the watery Laythe, these are some of the most diverse places in the solar system, and Kerbals are willing to pay extra to visit all of them at once.
	notes = Bringing an ISRU would be a good idea on this mission.
	synopsis = Board the tourists in your space plane, complete a Jool 5, then land back at the KSC.
	completedMessage = You did it! You look much older than when you left'
	agent = Tudor Airlines
	minExpiry = 0.0
    maxExpiry = 0.0
	cancellable = true
	declinable = false
	autoAccept = false
	prestige = Trivial
   	targetBody = Kerbin
	maxSimultaneous = 1
	rewardScience = 78.0
    rewardReputation = 45.0
    rewardFunds = Random(1300000, 1700000)
    failureReputation = 15.0
    failureFunds = 1500000.0
    advanceFunds = 275000.0
	BEHAVIOUR
	{
		name = SpawnPassengers
		type = SpawnPassengers
		count = Random(4, 7)
		kerbalType = Tourist
		removePassengers = true
	}
	PARAMETER
		{
			name = VesselParameterGroup
			type = VesselParameterGroup
			title = Your aircraft must
			
			define = @/craft
			dissassociateVesselsOnContractCompletion = true

			PARAMETER
			{
				name = HasCrew
				type = HasCrew
				title = have a certified pilot
				
				trait = Pilot
				minCrew = 1
			
				disableOnStateChange = false
				hideChildren = true

			}
			PARAMETER
			{
				name = HasPassengers
				type = HasPassengers

			}

			PARAMETER
			{
				name = PartValidation
				type = PartValidation
				title = have wings
				
				category = Aero
				
				disableOnStateChange = false
				hideChildren = true

			}
			
			PARAMETER
			{
				name = PartValidation
				type = PartValidation
				title = not have any solid rocket motors

				NONE
				{
					MODULE
					{
						name = ModuleEngines
						allowShutdown = False
						
					}
					
				}
				
				disableOnStateChange = false
				hideChildren = true
				
			}
			
			disableOnStateChange = false

		}
		//Things to acomplish
	PARAMETER
	{
		name = All
		type = All
		title = Visit Laythe
		
		PARAMETER
		{
			name = VesselParameterGroup
			type = VesselParameterGroup
			title = Land on the Laythe!
			
			vessel = @/craft
			
			PARAMETER
			{
				name = ReachState
				type = ReachState
				
				targetBody = Laythe
				situation = LANDED
                maxSpeed = 0.0
				
				disableOnStateChange = false
				hideChildren = true
				hidden = true
				
			}
		
			completeInSequence = false
			disableOnStateChange = false
			hideChildren = true	

		}	
	}
	PARAMETER
