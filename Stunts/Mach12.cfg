

CONTRACT_TYPE
{

	sortKey = c4
	
//REQUIREMENTS FOR CONTRACT TO APPEAR

	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		
		contractType = Mach9
		minCount = 1
		
	}
	

//DATA NODES TO PROCESS FOR CONTRACT USE

//Contract Specific VesselParameterGroup Definition Key (to prevent conflict with other active contracts)
	DATA
	{
		type = string
		
		craft = Mach12
		
	}
	

//CONTRACT DESCRIPTION

//Contract Descriptions
	name = Mach12
	title = Reach Mach 12
	group = CoastGuard
	agent = KSC Coast Guard
	
	description = Look, this is probably impossible to do. How do we know that? We were calculating the odds of survival on our Positronic Mainframe, when it malfunctioned. Apparently we broke all Three Laws of Kerbotics when we asked it if you would survive. You can try reaching Mach 12, if you dare, but we won't be funding you, since we need to repair the mainframe. The prestige and scientific progress you would get from this would be worthwhile, though.
	synopsis = Launch an airplane from the runway, fly between 2,500m and 69,000m and exceed 4,116 m/s.
	
	notes = Nobody will blame you if you can't do it.

	completedMessage = Congratulations! You have achieved Mach 12!&br;&br;We didn't think it were possible, but you went ahead and did it anyways! I guess we'll have to cancel the funeral procession we prepared.&br;&br; Also, we found out why our mainframe broke. We implied potential harm to you, the mainframe disobeyed our orders, and it concluded that your flight could boast considerable danger to itself.
//Contract Limits
  	maxCompletions = 1
   	maxSimultaneous = 1
//	weight = 10.0

	autoAccept = false
	declinable = true
	cancellable = true
	
	minExpiry = 7.0
	maxExpiry = 7.0
	deadline = 0
 
//Contract Reward Modifiers
	prestige = Trivial
   	targetBody = HomeWorld()

//Contract Rewards
  	advanceFunds = 40000
  	rewardFunds = 100000.0
  	rewardReputation = 69.0
 	rewardScience = 54.0

//Contract Penalties
  	failureFunds = 20000.0
 	failureReputation = 5.0
	

//BEHAVIOURS TO DO WHEN CREATING CONTRACT
	BEHAVIOUR
	{
		name = AwardExperience
		type = AwardExperience
		
		parameter = SSILand
		experience = 1
		
	}
	
	
//PARAMETERS FOR CONTRACT COMPLETION

//Craft definition
	PARAMETER
	{
		name = VesselParameterGroup
		type = VesselParameterGroup
		title = Your aircraft must
		
		define = @/craft
		dissassociateVesselsOnContractCompletion = true

		PARAMETER
		{
			name = HasCrew
			type = HasCrew
			title = have a certified pilot
			
			trait = Pilot
			minCrew = 1
		
			disableOnStateChange = false
			hideChildren = true

		}

		PARAMETER
		{
			name = PartValidation
			type = PartValidation
			title = have wings
			
			category = Aero
			
			disableOnStateChange = false
			hideChildren = true

		}
		
        PARAMETER
        {
            name = PartValidation
            type = PartValidation
            title = not have any solid rocket motors

            NONE
            {
                MODULE
                {
                    name = ModuleEngines
					allowShutdown = False
					
                }
				
            }
			
			disableOnStateChange = false
			hideChildren = true
			
        }
		
		disableOnStateChange = false

	}

//Contract Goals
	PARAMETER
	{
		name = All
		type = All
		title = achieve Mach 12
		
		PARAMETER
		{
			name = VesselParameterGroup
			type = VesselParameterGroup
			title = fly between 2500m and 69,000m
			
			vessel = @/craft
			
			PARAMETER
			{
				name = ReachState
				type = ReachState
				
				targetBody = HomeWorld()
				situation = FLYING
				minAltitude = 2500
				maxAltitude = 69000

				disableOnStateChange = false
				hideChildren = true
				hidden = true
				
			}
		
			completeInSequence = false
			disableOnStateChange = false
			hideChildren = true	

		}
		
		PARAMETER
		{
			name = VesselParameterGroup
			type = VesselParameterGroup
			title = fly faster than 4116 m/s
			
			vessel = @/craft
			
			PARAMETER
			{
				name = ReachState
				type = ReachState
				
				targetBody = HomeWorld()
				situation = FLYING
				minSpeed = 4116

				disableOnStateChange = false
				hideChildren = true
				hidden = true
				
			}
		
			completeInSequence = false
			disableOnStateChange = false
			hideChildren = true	

		}
	}
	
}
