CONTRACT_TYPE
{

	sortKey = c4
	
//REQUIREMENTS FOR CONTRACT TO APPEAR

	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = LandOnGilly
		minCount = 1
		
	}

//DATA NODES TO PROCESS FOR CONTRACT USE

//Contract Specific VesselParameterGroup Definition Key (to prevent conflict with other active contracts)
	DATA
	{
		type = string
		
		craft = EvePlane
		
	}
	

//CONTRACT DESCRIPTION

//Contract Descriptions
	name = OrbitEve
	title = Reach Eve Orbit
	group = TASSTOdivision
	agent = TA SSTO Division
	
	description = It's been said that Eve is the hardest planet to take off from in the entire Solar System, so obviously we want you to land on it and then get back to orbit using an SSTO
	
	synopsis = Land on Eve, then get back to orbit.

	notes = You don't even need to make it back home!
	
	completedMessage = You did it!

//Contract Limits
  	maxCompletions = 1
   	maxSimultaneous = 1
//	weight = 10.0

	autoAccept = false
	declinable = true
	cancellable = true
	
	minExpiry = 7.0
	maxExpiry = 7.0
	deadline = 0
 
//Contract Reward Modifiers
	prestige = Exceptional
   	targetBody = Kerbin

//Contract Rewards
  	advanceFunds = 10000
  	rewardFunds = 290000.0
  	rewardReputation = 35.0
 	rewardScience = 5.0

//Contract Penalties
  	failureFunds = 200000.0
 	failureReputation = 50.0
	

//BEHAVIOURS TO DO WHEN CREATING CONTRACT
	BEHAVIOUR
	{
		name = AwardExperience
		type = AwardExperience
		
		parameter = SSILand
		experience = 1
		
	}
	
	
//PARAMETERS FOR CONTRACT COMPLETION

//Craft definition
	PARAMETER
	{
		name = VesselParameterGroup
		type = VesselParameterGroup
		title = Your aircraft must
		
		define = @/craft
		dissassociateVesselsOnContractCompletion = true

		PARAMETER
		{
			name = HasCrew
			type = HasCrew
			title = have a 2 certified pilots
			
			trait = Pilot
			minCrew = 2
		
			disableOnStateChange = false
			hideChildren = true

		}

		PARAMETER
		{
			name = PartValidation
			type = PartValidation
			title = have wings
			
			category = Aero
			
			disableOnStateChange = false
			hideChildren = true

		}
		
        PARAMETER
        {
            name = PartValidation
            type = PartValidation
            title = not have any solid rocket motors

            NONE
            {
                MODULE
                {
                    name = ModuleEngines
					allowShutdown = False
					
                }
				
            }
			
			disableOnStateChange = false
			hideChildren = true
			
        }
		
		disableOnStateChange = false

	}

//Contract Goals
	PARAMETER
		{
			name = VesselParameterGroup
			type = VesselParameterGroup
			title = Land on Eve
			
			vessel = @/craft
			
			PARAMETER
			{
				name = ReachState
				type = ReachState
				
				targetBody = Eve
				situation = LANDED
                maxSpeed = 0.0
				
				

				disableOnStateChange = false
				hideChildren = true
				hidden = true
				
			}
		
			completeInSequence = true
			disableOnStateChange = true
			hideChildren = true	

		}	
		PARAMETER
		{
			name = VesselParameterGroup
			type = VesselParameterGroup
			title = Then reach stable Eve orbit!
			
			vessel = @/craft
			
			PARAMETER
			{
				name = ReachState
				type = ReachState
				
				targetBody = Eve
				situation = ORBITING
				
				

				disableOnStateChange = false
				hideChildren = true
				hidden = true
				
			}
		
			completeInSequence = true
			disableOnStateChange = true
			hideChildren = true	

		}	
}