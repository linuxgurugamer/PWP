
CONTRACT_TYPE
{

	sortKey = a3

//REQUIREMENTS FOR CONTRACT TO APPEAR

	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		
		contractType = 100s
		minCount = 1
		
	}
	

//DATA NODES TO PROCESS FOR CONTRACT USE

//Contract Specific VesselParameterGroup Definition Key (to prevent conflict with other active contracts)
	DATA
	{
		type = string
		
		craft = 200s
		
	}
	

//CONTRACT DESCRIPTION

//Contract Descriptions
	name = 200s-Mach1
	title = Fly an airplane to 2,500m, then fly for 200 seconds at Mach 1!
	group = PWP
	agent = Tudor Aerospace
	
	description = Taking off and landing is easy. Flying up to 2,500m with an air-breathing engine, and landing back at the runway is easy. Flying for 200 second at hypersonic speeds without crashing....that's a different story. Tudor Kerman says long duration flights, at Mach 1 are the basis for comercial flying, so you might as well get good at that.
	
	synopsis = Simply launch an airplane from the runway, fly up to 2,500m,fly for 100s at Mach 1, then land back at the runway safely.
	
	notes = Don't forget the vomit bag!
	
	completedMessage = With each long duration flight, and with each high speed flight, we get closer to comercial flying!!&br;&br;Your pilots are starting to show some amazing skill.

//Contract Limits
  	maxCompletions = 1
   	maxSimultaneous = 1
//	weight = 100.0

	autoAccept = false
	declinable = true
	cancellable = true
	
	minExpiry = 7.0
	maxExpiry = 7.0
	deadline = 0
 
//Contract Reward Modifiers
	prestige = Trivial
   	targetBody = HomeWorld()

//Contract Rewards
  	advanceFunds = 5000
  	rewardFunds = 15000.0
  	rewardReputation = 7.0
 	rewardScience = 5.0

//Contract Penalties
  	failureFunds = 8000.0
 	failureReputation = 10.0
	
	
//PARAMETERS FOR CONTRACT COMPLETION

//Craft definition
	PARAMETER
	{
		name = VesselParameterGroup
		type = VesselParameterGroup
		title = Your aircraft must
		
		define = @/craft
		dissassociateVesselsOnContractCompletion = true

		PARAMETER
		{
			name = HasCrew
			type = HasCrew
			title = have a certified pilot
			
			trait = Pilot
			minCrew = 1
		
			disableOnStateChange = false
			hideChildren = true

		}

		PARAMETER
		{
			name = PartValidation
			type = PartValidation
			title = have wings
			
			category = Aero
			
			disableOnStateChange = false
			hideChildren = true

		}
		
		PARAMETER
		{
			name = All
			type = All
			title = have an air breathing engine only
			
			PARAMETER
			{
				name = PartValidation
				type = PartValidation
				title = not have any solid rocket engines

				NONE
				{
					MODULE
					{
						EngineType = SolidBooster
						
					}
					
				}
				
				disableOnStateChange = false
				hideChildren = true
			
			}
			
			PARAMETER
			{
				name = PartValidation
				type = PartValidation
				title = not have any liquid rocket engines

				NONE
				{
					MODULE
					{
						EngineType = LiquidFuel
						
					}
					
				}
				
				disableOnStateChange = false
				hideChildren = true
			
			}
			

			PARAMETER
			{
				name = HasResource
				type = HasResource
				title = not have any solid rocket fuel
				
				resource = SolidFuel				
				minQuantity = 0.0
				maxQuantity = 0.0
				
				disableOnStateChange = false
				hideChildren = true
		
			}
			
			PARAMETER
			{
				name = HasResource
				type = HasResource
				title = not have any oxidizer
				
				resource = Oxidizer				
				minQuantity = 0.0
				maxQuantity = 0.0
				
				disableOnStateChange = false
				hideChildren = true
		
			}
			
			disableOnStateChange = false
		
		}
		
		disableOnStateChange = false

	}

//Contract Goals
	PARAMETER
	{
		name = VesselParameterGroup
		type = VesselParameterGroup
		title = fly up to 2,500m and fly for 200 seconds at mach 1
		
		vessel = @/craft
		
		PARAMETER
		{
			name = ReachState
			type = ReachState
			
			targetBody = HomeWorld()
			situation = FLYING
			minAltitude = 2500

			disableOnStateChange = false
			hideChildren = false
			hidden = false
			
		}


			PARAMETER
			{
				name = ReachState
				type = ReachState
				
				targetBody = HomeWorld()
				situation = FLYING
				minSpeed = 343

				disableOnStateChange = false
				hideChildren = false
				hidden = false
				
			}
		
			completeInSequence = false
			disableOnStateChange = false
			hideChildren = true	

		PARAMETER
		{
			name = Duration
			type = Duration
			
			duration = 200s
			preWaitText = and hold for:
			waitingText = and hold for: 
			completionText = You did it!

			completeInSequence = true
			disableOnStateChange = false	
			hidden = false		
			
		}
	
		completeInSequence = true
		disableOnStateChange = false
		hideChildren = false
	}
	
